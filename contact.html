<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

  <title>تماس با ما | ترنم اترک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #1e293b); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; font-family: 'Vazirmatn', sans-serif; }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .container { max-width: 600px; width: 100%; background: rgba(255, 255, 255, 0.035); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 50px; text-align: center; }
    h1 { font-size: 2.5rem; color: #fff; margin-bottom: 30px; }
    .contact-info { margin: 20px 0; padding: 20px; background: rgba(255, 255, 255, 0.05); border-radius: 15px; }
    p { font-size: 1.2rem; margin: 10px 0; color: #e8c7d0; }
    .btn-back { display: inline-block; margin-top: 30px; padding: 12px 40px; border: 1px solid #e8c7d0; border-radius: 30px; color: #e8c7d0; text-decoration: none; transition: 0.3s; }
    .btn-back:hover { background: #e8c7d0; color: #1e1b4b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>تماس با ترنم اترک</h1>
    <p>جهت مشاوره و سفارش پروژه، تیم ما آماده همکاری با شماست:</p>
    
    <div class="contact-info">
      <p><strong>مهندس امیر برهانی:</strong> 09154824200</p>
      <p><strong>مهندس علی الداغی:</strong> 09107782207</p>
    </div>
    
    <p style="font-size: 0.9rem; margin-top: 20px; color: #94a3b8;">از مرحله ایده‌پردازی تا تولید نهایی در کنار شما هستیم.</p>
    
    <a href="index.html" class="btn-back">بازگشت به صفحه اصلی</a>
  </div>
</body>
</html>
