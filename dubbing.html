<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دوبله انیمیشن | ترنم اترک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    /* استایل مشابه صفحه اصلی با پس‌زمینه متحرک */
    body { 
      background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #1e293b); 
      background-size: 400% 400%; 
      animation: gradientBG 15s ease infinite; 
      color: #f1f5f9; 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      padding: 40px 20px; 
      font-family: 'Vazirmatn', sans-serif; 
      margin: 0;
    }
    
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .header-section { 
      max-width: 900px; 
      width: 100%; 
      background: rgba(255, 255, 255, 0.035); 
      backdrop-filter: blur(16px); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      border-radius: 24px; 
      padding: 40px; 
      text-align: center; 
      margin-bottom: 40px;
    }

    h1 { 
      font-size: 2.5rem; 
      font-weight: 900; 
      background: linear-gradient(135deg, #fff7f3 0%, #f2d9d2 45%, #e8c7d0 100%); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
      margin-bottom: 15px; 
    }

    p { font-size: 1rem; color: #cbd5e1; margin-bottom: 20px; }

    /* شبکه نمایش ویدیوها */
    .dubbing-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
      max-width: 1100px;
      width: 100%;
    }

    .video-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 15px;
      transition: 0.3s ease;
      overflow: hidden;
    }

    .video-card:hover {
      transform: translateY(-10px);
      background: rgba(255, 255, 255, 0.08);
      border-color: #e8c7d0;
    }

    video {
      width: 100%;
      border-radius: 12px;
      aspect-ratio: 16 / 9; /* یا اگر عمودی هستند auto بگذارید */
      background: #000;
    }

    .video-info {
      margin-top: 15px;
      text-align: right;
      padding: 0 10px;
    }

    .video-info h3 {
      font-size: 1.1rem;
      color: #e8c7d0;
      margin-bottom: 5px;
    }

    .video-info p {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    .btn-back { 
      display: inline-block; 
      margin-top: 30px;
      padding: 10px 30px; 
      background: rgba(255, 255, 255, 0.05); 
      border: 1px solid #e8c7d0; 
      border-radius: 30px; 
      color: #e8c7d0; 
      text-decoration: none; 
      transition: 0.3s; 
    }

    .btn-back:hover { background: #e8c7d0; color: #1e1b4b; }

    @media (max-width: 600px) {
      h1 { font-size: 1.8rem; }
      .dubbing-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="header-section">
    <h1>🎙️ دوبلاژ و صداپیشگی</h1>
    <p>همکاری با برترین گویندگان برای پروژه‌های انیمیشن و تیزر. کیفیت صدا، روحِ اثر شماست.</p>
    <a href="index.html" class="btn-back">بازگشت به ویترین</a>
  </div>

  <div class="dubbing-grid" id="videoGrid">
    <!-- ویدیوها توسط جاوااسکریپت اینجا اضافه می‌شوند -->
  </div>

  <script>
    // اطلاعات ویدیوها را اینجا وارد کنید
    const dubs = [
      {
        title: "دوبله انیمیشن شماره ۱",
        desc: "اجرای شخصیت فانتزی - پروژه ترنم اترک",
        filename: "dub1.mp4"
      },
      {
        title: "دوبله انیمیشن شماره ۲",
        desc: "نمونه صدای تیپ‌سازی شده برای کاراکتر طنز",
        filename: "dub2.mp4"
      },
      {
        title: "دوبله انیمیشن شماره ۳",
        desc: "صداپیشگی شخصیت‌های مکمل انیمیشن",
        filename: "dub3.mp4"
      }
    ];

    const grid = document.getElementById('videoGrid');
    const path = "dubbing/"; // مسیر پوشه ویدیوها در گیت‌هاب

    dubs.forEach(dub => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <video controls preload="metadata">
          <source src="${path + dub.filename}" type="video/mp4">
          مرورگر شما از ویدیو پشتیبانی نمی‌کند.
        </video>
        <div class="video-info">
          <h3>${dub.title}</h3>
          <p>${dub.desc}</p>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>

</body>
</html>
