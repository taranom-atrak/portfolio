<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نمونه کارهای گرافیک | ترنم اترک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #020617;
      color: #fff;
      font-family: 'Vazirmatn', sans-serif;
    }

    h1 {
      text-align: center;
      color: #f3d6de;
      margin: 10px 0 30px;
      font-size: 2.3rem;
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
    }

    .btn {
      padding: 10px 22px;
      border: 1px solid #e8c7d0;
      border-radius: 999px;
      background: transparent;
      color: #e8c7d0;
      cursor: pointer;
      font-family: inherit;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover,
    .btn.active {
      background: #e8c7d0;
      color: #020617;
    }

    .gallery-grid {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 24px;
    }

    .gallery-item {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      height: 440px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-item:hover {
      transform: translateY(-6px);
      border-color: #e8c7d0;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .footer {
      text-align: center;
      margin-top: 44px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.92);
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-inner {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 70px 20px 30px;
    }

    .modal img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      transform: scale(1);
      transform-origin: center center;
      transition: transform 0.12s ease;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      user-select: none;
      -webkit-user-drag: none;
    }

    .close-modal {
      position: absolute;
      top: 16px;
      right: 22px;
      font-size: 42px;
      color: #fff;
      cursor: pointer;
      z-index: 10001;
      user-select: none;
      line-height: 1;
    }

    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      .gallery-item { height: 360px; }
      .modal img { max-width: 94vw; max-height: 80vh; }
    }
  </style>
</head>
<body>

  <h1>نمونه کارهای گرافیک</h1>

  <div class="filters">
    <button class="btn active" onclick="filterItems('all', this)">همه</button>
    <button class="btn" onclick="filterItems('poster', this)">پوستر</button>
    <button class="btn" onclick="filterItems('infographic', this)">اینفوگرافیک</button>
  </div>

  <div class="gallery-grid" id="gallery"></div>

  <div class="footer">
    <a href="index.html" class="btn">بازگشت به صفحه اصلی</a>
  </div>

  <div class="modal" id="imageModal">
    <div class="modal-inner" id="modalInner">
      <span class="close-modal" id="closeModal">&times;</span>
      <img id="modalImage" src="" alt="preview">
    </div>
  </div>

  <script>
    const posters = [
      "poster1.1.jpg",
      "poster1.2.jpg",
      "poster2.jpg",
      "poster3.jpg",
      "poster4.jpg",
      "poster5.jpg",
      "poster6.jpg",
      "poster7.jpg",
      "poster8.jpg",
      "poster9.jpg",
      "poster10.jpg",
      "poster11-hamyar.jpg",
      "poster12.jpg",
      "poster13.jpg",
      "poster14.jpg",
      "poster15.jpg",
      "poster16.jpg",
      "poster17.jpg",
      "poster18.jpg",
      "poster19.jpg",
      "poster20.jpg",
      "poster21.jpg",
      "poster22.jpg",
      "poster23.jpg",
      "poster24.jpg",
      "poster25.jpg",
      "poster26.jpg",
      "poster27.jpg",
      "poster28.jpg",
      "poster29.jpg",
      "poster30.jpg"
    ];

    const infographics = [
      "posterinf1.jpg",
      "posterinf2.jpg",
      "posterinf3.jpg",
      "posterinf4.jpg",
      "posterinf5.jpg",
      "posterinf6.jpg",
      "posterinf7.jpg",
      "posterinf8.jpg",
      "posterinf9.jpg",
      "posterinf10.jpg",
      "posterinf11.jpg",
      "posterinf12.jpg"
    ];

    const gallery = document.getElementById("gallery");
    const modal = document.getElementById("imageModal");
    const modalInner = document.getElementById("modalInner");
    const modalImage = document.getElementById("modalImage");
    const closeModal = document.getElementById("closeModal");

    let scale = 1;

    function applyZoom() {
      modalImage.style.transform = `scale(${scale})`;
    }

    function resetZoom() {
      scale = 1;
      applyZoom();
    }

    function openModal(src) {
      modalImage.src = src;
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
      resetZoom();
    }

    function closeModalFunc() {
      modal.classList.remove("show");
      modalImage.src = "";
      document.body.style.overflow = "";
      resetZoom();
    }

    function createItem(src, category, fileName) {
      const item = document.createElement("div");
      item.className = "gallery-item";
      item.dataset.category = category;

      const img = document.createElement("img");
      img.src = src;
      img.alt = fileName;
      img.loading = "lazy";

      img.onerror = function () {
        item.style.background = "#334155";
        item.innerHTML = `
          <div style="color:#f8cdd6;padding:20px;text-align:center;font-size:14px;line-height:1.9">
            این فایل پیدا نشد
            <br>
            ${fileName}
          </div>
        `;
      };

      item.appendChild(img);

      item.addEventListener("click", function () {
        openModal(src);
      });

      gallery.appendChild(item);
    }

    posters.forEach(file => {
      createItem(`/portfolio/images/poster/${file}`, "poster", file);
    });

    infographics.forEach(file => {
      createItem(`/portfolio/images/poster-infographic/${file}`, "infographic", file);
    });

    function filterItems(category, button) {
      document.querySelectorAll(".filters .btn").forEach(btn => btn.classList.remove("active"));
      button.classList.add("active");

      document.querySelectorAll(".gallery-item").forEach(item => {
        item.style.display =
          category === "all" || item.dataset.category === category
            ? "flex"
            : "none";
      });
    }

    modal.addEventListener("wheel", function (e) {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(0.5, scale), 5);
      applyZoom();
    }, { passive: false });

    closeModal.addEventListener("click", function (e) {
      e.stopPropagation();
      closeModalFunc();
    });

    modal.addEventListener("click", function (e) {
      if (e.target === modal) {
        closeModalFunc();
      }
    });

    modalInner.addEventListener("click", function (e) {
      e.stopPropagation();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        closeModalFunc();
      }
    });
  </script>

</body>
</html>
