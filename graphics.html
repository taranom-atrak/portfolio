<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نمونه کارهای گرافیک | ترنم اترک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    body { background: #020617; color: white; font-family: 'Vazirmatn', sans-serif; text-align: center; margin: 0; padding: 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 40px auto; }
    
    .gallery-item { height: 350px; background: #1e293b; border-radius: 15px; overflow: hidden; cursor: pointer; transition: 0.3s; border: 2px solid #334155; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
    .gallery-item:hover { transform: scale(1.03); border-color: #e8c7d0; }
    .gallery-item:hover img { transform: scale(1.1); }

    .btn { padding: 10px 25px; margin: 5px; border: 1px solid #e8c7d0; border-radius: 25px; background: transparent; color: #e8c7d0; cursor: pointer; }
    .btn:hover { background: #e8c7d0; color: #020617; }
    .footer { margin-top: 50px; }
  </style>
</head>
<body>

  <h1>نمونه کارهای گرافیک</h1>
  <div>
      <button class="btn" onclick="filter('all')">همه</button>
      <button class="btn" onclick="filter('poster')">پوستر</button>
      <button class="btn" onclick="filter('infographic')">اینفوگرافیک</button>
  </div>

  <div class="gallery-grid" id="grid">
    <script>
      // لیست پوسترهای شما (دقیقاً مطابق نام فایل‌های گیت‌هاب)
      const posters = ["poster1.1.jpg", "poster1.2.jpg", "poster10.jpg", "poster11-hamyar.jpg", "poster12.jpg", "poster13.jpg", "poster14.jpg", "poster15.jpg", "poster16.jpg", "poster17.jpg", "poster18.jpg", "poster19.jpg", "poster2.jpg", "poster20.jpg", "poster21.jpg", "poster22.jpg", "poster23.jpg", "poster24.jpg", "poster25.jpg", "poster26.jpg", "poster27.jpg", "poster28.jpg", "poster29.jpg", "poster3.jpg", "poster30.jpg", "poster4.jpg", "poster5.jpg", "poster6.jpg", "poster7.jpg", "poster8.jpg", "poster9.jpg"];
      
      const infos = ["posterinf1.jpg", "posterinf10.jpg", "posterinf11.jpg", "posterinf12.jpg", "posterinf2.jpg", "posterinf3.jpg", "posterinf4.jpg", "posterinf5.jpg", "posterinf6.jpg", "posterinf7.jpg", "posterinf8.jpg", "posterinf9.jpg"];

      posters.forEach(name => {
        document.write(`<div class="gallery-item" data-cat="poster"><img src="images/poster/${name}"></div>`);
      });
      infos.forEach(name => {
        document.write(`<div class="gallery-item" data-cat="infographic"><img src="images/poster-infographic/${name}"></div>`);
      });

      function filter(cat) {
        document.querySelectorAll('.gallery-item').forEach(el => {
          el.style.display = (cat === 'all' || el.dataset.cat === cat) ? 'block' : 'none';
        });
      }
    </script>
  </div>

  <div class="footer"><a href="index.html" class="btn">بازگشت به منوی اصلی</a></div>
</body>
</html>
