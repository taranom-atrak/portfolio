<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>گالری گرافیک | ترنم اترک</title>
  <style>
    body { background: #020617; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
    .gallery-item { height: 350px; background: #1e293b; border-radius: 15px; overflow: hidden; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 1px solid #334155; }
    .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
    
    /* مودال زوم */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 9999; overflow: hidden; }
    .modal-content-wrapper { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; cursor: grab; }
    .modal img { max-width: 90vw; max-height: 90vh; transition: transform 0.1s; transform-origin: center; }
  </style>
</head>
<body>

  <div class="gallery-grid" id="gallery"></div>

  <div class="modal" id="modal">
    <div class="modal-content-wrapper" id="wrapper">
      <img id="zoomImg" src="" alt="zoom">
    </div>
  </div>

  <script>
    const posters = ["poster1.1.jpg", "poster1.2.jpg", "poster10.jpg", "poster11-hamyar.jpg", "poster12.jpg", "poster13.jpg", "poster14.jpg", "poster15.jpg", "poster16.jpg", "poster17.jpg", "poster18.jpg", "poster19.jpg", "poster2.jpg", "poster20.jpg", "poster21.jpg", "poster22.jpg", "poster23.jpg", "poster24.jpg", "poster25.jpg", "poster26.jpg", "poster27.jpg", "poster28.jpg", "poster29.jpg", "poster3.jpg", "poster30.jpg", "poster4.jpg", "poster5.jpg", "poster6.jpg", "poster7.jpg", "poster8.jpg", "poster9.jpg"];
    
    const gallery = document.getElementById("gallery");
    const modal = document.getElementById("modal");
    const zoomImg = document.getElementById("zoomImg");
    let scale = 1;

    posters.forEach(file => {
      const div = document.createElement("div");
      div.className = "gallery-item";
      div.innerHTML = `<img src="images/poster/${file}" onerror="this.parentElement.innerHTML='<p>خطا در لود:<br>${file}</p>'">`;
      div.onclick = () => {
        zoomImg.src = `images/poster/${file}`;
        modal.style.display = "block";
        scale = 1; zoomImg.style.transform = `scale(${scale})`;
      };
      gallery.appendChild(div);
    });

    // بستن با کلیک خارج از عکس
    modal.onclick = (e) => { if(e.target === modal) modal.style.display = "none"; };

    // زوم با اسکرول موس
    modal.onwheel = (e) => {
      e.preventDefault();
      scale += e.deltaY * -0.001;
      scale = Math.min(Math.max(0.5, scale), 4);
      zoomImg.style.transform = `scale(${scale})`;
    };
  </script>
</body>
</html>
