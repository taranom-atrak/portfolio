<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>طراحی گرافیک | ترنم اترک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #1e293b); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #f1f5f9; min-height: 100vh; padding: 40px 20px; font-family: 'Vazirmatn', sans-serif; margin: 0; }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .header { text-align: center; margin-bottom: 50px; }
    h1 { font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #fff, #e8c7d0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* استایل گالری */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
    }

    .gallery-item:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: #e8c7d0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .gallery-item img {
      width: 100%;
      height: auto; /* برای حفظ نسبت ابعاد عکس */
      display: block;
      transition: 0.5s;
    }

    .item-info { padding: 15px; text-align: center; background: rgba(0,0,0,0.4); }
    .item-info h3 { margin: 0; font-size: 1rem; color: #e8c7d0; }

    .footer-nav { text-align: center; margin-top: 50px; }
    .btn-back { display: inline-block; padding: 12px 40px; border: 1px solid #e8c7d0; border-radius: 30px; color: #e8c7d0; text-decoration: none; transition: 0.3s; }
    .btn-back:hover { background: #e8c7d0; color: #1e1b4b; }

    /* استایل دکمه‌های فیلتر */
    .filter-buttons {
        text-align: center;
        margin-bottom: 30px;
    }
    .filter-buttons button {
        padding: 10px 25px;
        margin: 0 10px;
        border: 1px solid #e8c7d0;
        border-radius: 25px;
        background: transparent;
        color: #e8c7d0;
        cursor: pointer;
        transition: 0.3s;
        font-size: 1rem;
    }
    .filter-buttons button:hover, .filter-buttons button.active {
        background: #e8c7d0;
        color: #1e1b4b;
    }
  </style>
</head>
