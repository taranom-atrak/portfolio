<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استودیو ترنم اترک</title>
    <style>
        @font-face { font-family: 'Yekan'; src: url('https://cdn.fontcdn.ir/Font/Persian/Yekan/Yekan.woff2') format('woff2'); }
        body { background: #0f0f0f; color: #fff; font-family: 'Yekan', Tahoma, sans-serif; text-align: center; margin: 0; padding: 40px 20px; }
        .hero { margin-bottom: 40px; }
        h1 { font-size: 2em; color: #ff3e3e; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; max-width: 700px; margin: 0 auto; }
        .btn { padding: 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 15px; cursor: pointer; transition: 0.4s; font-size: 1.1em; color: #eee; }
        .btn:hover { background: #ff3e3e; border-color: #ff3e3e; transform: translateY(-5px); box-shadow: 0 10px 20px rgba(255,62,62,0.2); }
        .footer { margin-top: 50px; color: #555; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>ترنم اترک</h1>
        <p>استودیوی خلاق رسانه‌ای و تولید محتوا</p>
    </div>
    
    <div class="grid">
        <div class="btn">🎬 موشن گرافیک</div>
        <div class="btn">🎨 طراحی گرافیک و پوستر</div>
        <div class="btn">🎙️ تولید پادکست و صدا</div>
        <div class="btn">🎤 دوبلاژ و نریشن</div>
        <div class="btn">📹 تدوین تیزر تبلیغاتی</div>
        <div class="btn">📞 سفارش پروژه / تماس با ما</div>
    </div>

    <div class="footer">
        <p>طراحی و اجرا توسط استودیو ترنم اترک © ۲۰۲۶</p>
    </div>
</body>
</html>
