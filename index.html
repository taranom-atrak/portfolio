<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ترنم اترک | استودیوی خلاق رسانه‌ای</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 50px 20px; }
        h1 { font-size: 2.5em; margin-bottom: 10px; color: #ff3e3e; }
        p { color: #aaa; font-size: 1.1em; margin-bottom: 40px; }
        .services { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: #161616; padding: 20px; border-radius: 15px; border: 1px solid #333; transition: 0.3s; }
        .card:hover { border-color: #ff3e3e; transform: translateY(-5px); }
        .footer { margin-top: 50px; color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>ترنم اترک</h1>
    <p>استودیوی خلاق رسانه‌ای و تولید محتوا</p>
    
    <div class="services">
        <div class="card"><h3>موشن گرافیک</h3></div>
        <div class="card"><h3>طراحی گرافیک</h3></div>
        <div class="card"><h3>تولید پادکست</h3></div>
        <div class="card"><h3>دوبلاژ و صدا</h3></div>
    </div>

    <div class="footer">
        <p>ارتباط با ما از طریق دایرکت اینستاگرام یا ایمیل</p>
    </div>
</body>
</html>
