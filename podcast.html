
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پادکست‌ها | ترنم اترک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #020617;
      color: #fff;
      font-family: 'Vazirmatn', sans-serif;
    }

    h1 {
      text-align: center;
      color: #f3d6de;
      margin: 10px 0 10px;
      font-size: 2.3rem;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 40px;
      font-size: 1.05rem;
    }

    /* طراحی شبکه متناسب با ویدیوهای عمودی */
    .podcast-grid {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 32px;
      justify-items: center;
    }

    .podcast-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 24px;
      padding: 16px;
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .podcast-card:hover {
      transform: translateY(-5px);
      border-color: #e8c7d0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    /* پلیر ویدیویی عمودی */
    .video-wrapper {
      width: 100%;
      aspect-ratio: 9/16; /* نسبت تصویر عمودی مثل گوشی */
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .podcast-info {
      width: 100%;
      text-align: right;
      padding: 0 8px;
    }

    .podcast-info h3 {
      margin: 0 0 8px 0;
      font-size: 1.1rem;
      color: #fff;
    }

    .podcast-info p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      margin-top: 50px;
    }

    .btn {
      padding: 10px 26px;
      border: 1px solid #e8c7d0;
      border-radius: 999px;
      background: transparent;
      color: #e8c7d0;
      cursor: pointer;
      font-family: inherit;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #e8c7d0;
      color: #020617;
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <h1>پادکست‌های ویدیویی</h1>
  <p class="subtitle">تولیدات و پادکست‌های تصویری ترنم اترک</p>

  <div class="podcast-grid" id="podcastGallery"></div>

  <div class="footer">
    <a href="index.html" class="btn">بازگشت به صفحه اصلی</a>
  </div>

  <script>
    // لیست فایل‌های پادکست ویدیویی
    const podcastFiles = [
      {
        title: "پادکست ویدیویی شماره ۱",
        description: " پروژه‌های شرکت گاز خراسان شمالی / پایش ادارات ",
        file: "podcast1.mp4"
      },
      {
        title: "پادکست ویدیویی شماره ۲",
        description: "پروژه‌های شرکت گاز خراسان شمالی / تفکیک کنتور ",
        file: "podcast2.mp4"
      }
    ];

    const gallery = document.getElementById("podcastGallery");

    podcastFiles.forEach(item => {
      const card = document.createElement("div");
      card.className = "podcast-card";

      // ایجاد بخش ویدیو
      const videoWrapper = document.createElement("div");
      videoWrapper.className = "video-wrapper";

      const video = document.createElement("video");
      video.controls = true;
      video.playsInline = true;
      video.preload = "metadata";
      // مشخص کردن مسیر فایل روی گیت هاب
      video.src = `/portfolio/podcast/${item.file}`;

      video.onerror = function() {
        console.log("خطا در بارگذاری ویدیو: " + item.file);
      };

      videoWrapper.appendChild(video);

      // ایجاد بخش توضیحات ویدیو
      const info = document.createElement("div");
      info.className = "podcast-info";

      const title = document.createElement("h3");
      title.textContent = item.title;

      const desc = document.createElement("p");
      desc.textContent = item.description;

      info.appendChild(title);
      info.appendChild(desc);

      card.appendChild(videoWrapper);
      card.appendChild(info);

      gallery.appendChild(card);
    });
  </script>

</body>
</html>
