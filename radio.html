<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>برنامه‌های رادیویی | ترنم اترک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #020617; /* هماهنگ با رنگ صفحه گرافیک */
      color: #fff;
      font-family: 'Vazirmatn', sans-serif;
    }

    h1 {
      text-align: center;
      color: #f3d6de;
      margin: 10px 0 10px;
      font-size: 2.3rem;
    }

    p.subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    .gallery-grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    /* کارت‌های صوتی */
    .audio-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .audio-card:hover {
      transform: translateY(-5px);
      border-color: #e8c7d0;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .audio-info {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    /* آیکون رادیو/میکروفون بجای کاور */
    .audio-icon {
      width: 60px;
      height: 60px;
      background: #334155;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #e8c7d0;
      flex-shrink: 0;
    }

    .audio-details h3 {
      margin: 0 0 6px 0;
      font-size: 1.15rem;
      color: #fff;
    }

    .audio-details p {
      margin: 0;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    /* استایل سفارشی پلیر صوتی مرورگر */
    audio {
      width: 100%;
      outline: none;
      border-radius: 30px;
    }

    /* دکمه بازگشت */
    .footer {
      text-align: center;
      margin-top: 50px;
    }

    .btn {
      padding: 10px 26px;
      border: 1px solid #e8c7d0;
      border-radius: 999px;
      background: transparent;
      color: #e8c7d0;
      cursor: pointer;
      font-family: inherit;
      transition: 0.3s;
      text-decoration: none;
      display: inline-block;
    }

    .btn:hover {
      background: #e8c7d0;
      color: #020617;
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.8rem; }
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <h1>برنامه‌های رادیویی</h1>
  <p class="subtitle">شنونده نمونه کارهای تولیدی و رادیویی ما باشید</p>

  <div class="gallery-grid" id="audioGallery">
    <!-- کارت‌ها توسط جاوااسکریپت در اینجا ساخته می‌شوند -->
  </div>

  <div class="footer">
    <a href="index.html" class="btn">بازگشت به صفحه اصلی</a>
  </div>

  <script>
    // لیست فایل‌های صوتی شما
    // مسیر فایل‌ها را متناسب با گیت‌هاب تنظیم کرده‌ام
    const audioFiles = [
      {
        title: "برنامه رادیویی شماره ۳۹",
        description: "تهیه شده در واحد صدا و سیما - ترنم اترک",
        file: "pad ab 39.MP3" // نام دقیق فایلی که فرستادید
      },
      {
        title: "برنامه رادیویی نمونه ۲",
        description: "پادکست اجتماعی و فرهنگی",
        file: "radio2.mp3" // نمونه برای فایل‌های بعدی شما
      }
    ];

    const gallery = document.getElementById("audioGallery");

    audioFiles.forEach(item => {
      // ساخت کارت صوتی
      const card = document.createElement("div");
      card.className = "audio-card";

      // ساخت بخش اطلاعات صوتی
      const infoDiv = document.createElement("div");
      infoDiv.className = "audio-info";

      const iconDiv = document.createElement("div");
      iconDiv.className = "audio-icon";
      iconDiv.innerHTML = "📻"; // آیکون رادیو

      const detailsDiv = document.createElement("div");
      detailsDiv.className = "audio-details";
      
      const titleElement = document.createElement("h3");
      titleElement.textContent = item.title;

      const descElement = document.createElement("p");
      descElement.textContent = item.description;

      detailsDiv.appendChild(titleElement);
      detailsDiv.appendChild(descElement);
      infoDiv.appendChild(iconDiv);
      infoDiv.appendChild(detailsDiv);

      // ساخت پلیر صوتی
      const audio = document.createElement("audio");
      audio.controls = true;
      
      // مشخص کردن مسیر فایل روی گیت هاب
      // فرض شده که فایل‌های صوتی در پوشه audio در کنار روت پروژه شما هستند
      audio.src = `/portfolio/audio/${item.file}`; 

      // مدیریت خطا در صورت پیدا نشدن فایل صوتی
      audio.onerror = function() {
        console.log("خطا در بارگذاری فایل: " + item.file);
      };

      card.appendChild(infoDiv);
      card.appendChild(audio);
      
      gallery.appendChild(card);
    });
  </script>



<div class="footer">
    <a href="index.html" class="btn">بازگشت به صفحه اصلی</a>
  </div>

  
</body>
</html>
