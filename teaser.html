<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>خدمات ترنم اترک</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    body { background: linear-gradient(-45deg, #0f172a, #1e1b4b, #020617, #1e293b); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #f1f5f9; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 60px 20px; font-family: 'Vazirmatn', sans-serif; }
    @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .container { max-width: 800px; width: 100%; background: rgba(255, 255, 255, 0.035); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 50px; text-align: center; }
    h1 { font-size: 3rem; font-weight: 900; background: linear-gradient(135deg, #fff7f3 0%, #f2d9d2 45%, #e8c7d0 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
    p { font-size: 1.1rem; line-height: 2; color: #cbd5e1; margin-bottom: 30px; }
    
    .btn-back { display: inline-block; padding: 12px 40px; background: rgba(255, 255, 255, 0.05); border: 1px solid #e8c7d0; border-radius: 30px; color: #e8c7d0; text-decoration: none; transition: 0.3s; }
    .btn-back:hover { background: #e8c7d0; color: #1e1b4b; }
  </style>
</head>
<body>
  <div class="container">
    <h1>[نام خدمت اینجا قرار بگیرد]</h1>
    <p>[توضیحات مفصل درباره این خدمت و روش کاری ترنم اترک را اینجا بنویس]</p>
    <a href="index.html" class="btn-back">بازگشت به ویترین</a>
  </div>
</body>
</html>
